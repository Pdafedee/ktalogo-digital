[project]
name = "ktalogo-digital"
version = "3.5.0"
description = "Tu vitrina digital que vende por ti"
requires-python = ">=3.10"
# Dependencias MÓVILES (todas pure-Python o incluidas con Flet).
# Reportlab/python-docx/Pillow quedan solo de escritorio vía requirements.txt:
# sus extensiones C no tienen ruedas para Android y romperían el build.
dependencies = [
  "flet==1.0.5",
  "flet-charts>=1.0.0",
  "segno>=1.6.6",
]

[tool.flet]
# Identidad de la app empaquetada (APK/APK/AAB · iOS · macOS · Windows)
org = "app.ktalogo"                # paquete final: app.ktalogo.digital
product = "Ktalogo-Dgital"
company = "Ktalogo"
copyright = "© 2026 Ktalogo-Dgital"

[tool.flet.android]
min_sdk_version = 21               # Android 5.0+

[tool.flet.android.permission]
INTERNET = true                    # catálogo, tasa BCV y pagos necesitan red
